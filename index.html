const STOP = new Set(['a','an','the','is','it','in','on','at','to','i','be','of','s','re','ve','ll','m','t']);

/* ═══════════════════════════════════════════════════
   語音工具
═══════════════════════════════════════════════════ */
const hasChinese = t => /[\u4e00-\u9fff\u3400-\u4dbf]/.test(t);

const isEnglish = t => {
  if (!t?.trim() || hasChinese(t)) return false;
  const letters = t.replace(/[^a-zA-Z]/g,'').length;
  const total   = t.replace(/\s/g,'').length;
  return total > 0 && letters/total >= 0.45;
};

const tokenize = t => t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>0);

const compareWords = (transcript, targetEn) => {
  const rec = new Set(tokenize(transcript));
  return tokenize(targetEn).map(word => ({ word, isStop: STOP.has(word), hit: rec.has(word) }));
};

const calcScore = comp => {
  const keys = comp.filter(w=>!w.isStop);
  return keys.length ? keys.filter(w=>w.hit).length / keys.length : 1;
};

/* ═══════════════════════════════════════════════════
   音訊錄製管理器（提供回放功能）
═══════════════════════════════════════════════════ */
class AudioRecorder {
  constructor(){ this.mr=null; this.chunks=[]; this.url=null; }

  async start(stream){
    this.chunks=[];
    if(this.url){ URL.revokeObjectURL(this.url); this.url=null; }
    // 選擇 iOS 支援的格式
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
               : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
               : '';
    this.mr = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
    this.mr.ondataavailable = e=>{ if(e.data.size>0) this.chunks.push(e.data); };
    this.mr.start();
  }

  stop(){
    return new Promise(resolve=>{
      if(!this.mr){ resolve(null); return; }
      this.mr.onstop = ()=>{
        const blob = new Blob(this.chunks);
        this.url = URL.createObjectURL(blob);
        resolve(this.url);
      };
      try{ this.mr.stop(); }catch(e){ resolve(null); }
    });
  }

  abort(){
    if(this.mr){ try{ this.mr.stop(); }catch(e){} this.mr=null; }
    this.chunks=[];
  }
}

class SpeechManager {
  constructor(){
    this.r=null; this.active=false; this.timer=null; this.gotResult=false;
    this.stream=null; // 保留 MediaStream 供 AudioRecorder 共用
    this.silentRetries=0; // 自動靜默重試計數
    this.MAX_SILENT=2;    // 最多自動重試 2 次再顯示提示
  }

  supported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }

  _clean(){
    if(this.timer){ clearTimeout(this.timer); this.timer=null; }
    if(this.r){
      try{ this.r.onresult=this.r.onerror=this.r.onend=this.r.onstart=null; this.r.abort(); }catch(e){}
      this.r=null;
    }
    this.active=false;
    this.gotResult=false;
  }

  _releaseStream(){
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
  }

  async start({ onResult, onError, onEnd, onNoResult, onRetrying, timeout=7000 }){
    this._clean();

    // 先取得麥克風權限並同時啟動錄音
    try{
      this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      await AR.start(this.stream);
    }catch(e){
      this._releaseStream();
      onError({code:'permission', msg:'請允許麥克風權限後再試！'});
      return;
    }

    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    const r  = new SR();
    this.r   = r;
    r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;

    r.onstart = ()=>{ this.active=true; this.gotResult=false; };

    r.onresult = ev => {
      clearTimeout(this.timer);
      this.gotResult = true;
      this.silentRetries = 0;
      const list = Array.from(ev.results[0]).map(a=>a.transcript.trim());
      // 先停止 MediaRecorder，拿到音訊 URL 後一起回傳
      AR.stop().then(audioUrl=>{
        this._releaseStream();
        onResult(list, audioUrl);
      });
    };

    r.onerror = ev => {
      clearTimeout(this.timer);
      const MAP = {
        'not-allowed':        {code:'permission', msg:'請允許麥克風權限後再試！'},
        'audio-capture':      {code:'no-mic',     msg:'找不到麥克風，請檢查裝置設定。'},
        'network':            {code:'network',     msg:null},
        'no-speech':          {code:'silence',     msg:null},
        'aborted':            {code:'aborted',     msg:null},
        'service-not-allowed':{code:'permission',  msg:'語音服務未開放，請確認 Safari 設定。'},
      };
      const e = MAP[ev.error]||{code:'unknown', msg:'辨識時發生問題，請再試一次。'};
      AR.abort(); this._clean(); this._releaseStream();
      onError(e);
    };

    r.onend = ()=>{
      clearTimeout(this.timer);
      const wasActive = this.active;
      const hadResult = this.gotResult;
      this._clean();

      if(wasActive && !hadResult){
        // 沒拿到結果：先嘗試自動靜默重試，避免打擾學生
        if(this.silentRetries < this.MAX_SILENT){
          this.silentRetries++;
          AR.abort();
          this._releaseStream();
          onRetrying(this.silentRetries);  // 通知 UI 顯示「再聽一次...」
          setTimeout(()=> this.start({onResult,onError,onEnd,onNoResult,onRetrying,timeout}), 600);
        } else {
          // 重試都失敗才回傳 onNoResult
          this.silentRetries = 0;
          AR.abort(); this._releaseStream();
          onNoResult();
        }
      } else {
        onEnd();
      }
    };

    try{
      r.start();
      this.timer = setTimeout(()=>{ try{ this.r?.stop(); }catch(e){} }, timeout);
    }catch(e){
      AR.abort(); this._clean(); this._releaseStream();
      onError({code:'start-fail', msg:'無法啟動麥克風，請重新整理頁面。'});
    }
  }

  stop(){ try{ this.r?.stop(); }catch(e){} }

  abort(){
    AR.abort();
    this._clean();
    this._releaseStream();
    this.silentRetries=0;
  }
}
const SM = new SpeechManager();

/* ═══════════════════════════════════════════════════
   主元件
═══════════════════════════════════════════════════ */
function App(){
  const [grade,setGrade]       = useState('1-1');
  const [idx,setIdx]           = useState(0);
  const [completed,setCompleted] = useState(INIT_COMPLETED);
  const [rate,setRate]         = useState(0.85);
  const [sidebar,setSidebar]   = useState(false);
  const [starAnim,setStarAnim] = useState(false);
  const [listened,setListened] = useState(false);
  const [hint,setHint]         = useState('');
  const [recStatus,setRecStatus] = useState('idle');
  const [comparison,setComparison] = useState([]);
  const [errMsg,setErrMsg]     = useState('');
  const [retries,setRetries]   = useState(0);
  const [audioUrl,setAudioUrl] = useState(null);   // 學生說話的錄音 URL
  const [retrying,setRetrying] = useState(0);      // 靜默重試次數（顯示用）
  const MAX_RETRY = 1;

  const sentences = ALL_DATA[grade].sentences;
  const cur       = sentences[idx];
  const doneList  = completed[grade];
  const isDone    = doneList.includes(idx);
  const progress  = Math.round(doneList.length/sentences.length*100);
  const isHigh    = HIGH.includes(grade);

  // 主題色
  const AC  = isHigh ? '#10b981' : '#0ea5e9';
  const ACD = isHigh ? '#059669' : '#0284c7';
  const ACL = isHigh ? '#d1fae5' : '#e0f2fe';
  const ACB = isHigh ? '#059669' : '#1d4ed8'; // 3d shadow

  useEffect(()=>{
    setListened(false); setHint(''); setRecStatus('idle');
    setComparison([]); setErrMsg(''); setRetries(0);
    setAudioUrl(null); setRetrying(0);
    SM.abort();
  },[idx,grade]);

  useEffect(()=>()=>SM.abort(),[]);

  const showHint = msg => { setHint(msg); setTimeout(()=>setHint(''),3500); };

  /* TTS */
  const speak = useCallback(text=>{
    setListened(true); setHint('');
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g,' '));
    u.lang='en-US'; u.rate=rate; u.pitch=1.1;
    window.speechSynthesis.speak(u);
  },[rate]);

  /* 錄音 */
  const doRecord = useCallback((auto=false)=>{
    if(!listened && !auto){ showHint('小提示：要先點「聽聽看」喔！'); return; }
    if(!SM.supported()){ setRecStatus('no_support'); return; }
    if(recStatus==='recording'){ SM.stop(); return; }

    setRecStatus('recording'); setComparison([]); setErrMsg('');

    setRetrying(0);

    SM.start({
      timeout: 7000,

      // onResult 現在多帶一個 audioUrl（MediaRecorder 錄下的音訊）
      onResult:(list, url)=>{
        setRetries(0); setRetrying(0);
        setAudioUrl(url);   // 存下讓學生可以回放

        // 只有全部候選都是中文才判中文
        if(list.length > 0 && list.every(hasChinese)){ setRecStatus('fail_lang'); return; }

        let bestComp=[], bestScore=-1;
        for(const t of list){
          if(!isEnglish(t)) continue;
          const c=compareWords(t,cur.en), s=calcScore(c);
          if(s>bestScore){ bestScore=s; bestComp=c; }
        }
        if(bestScore<0){ setRecStatus('fail_unclear'); return; }

        setComparison(bestComp);
        if(bestScore>=0.5)      setRecStatus('success');
        else if(bestScore>=0.2) setRecStatus('partial');
        else                    setRecStatus('fail_unclear');
      },

      // 靜默重試中：SpeechManager 內部自動重試，這裡只更新 UI 計數
      onRetrying:(count)=>{
        setRetrying(count);
      },

      // 重試全部失敗才呼叫：改顯示「沒聽清楚」
      onNoResult:()=>{
        setRetrying(0);
        setRecStatus('fail_unclear');
      },

      onError:({code,msg})=>{
        setRetrying(0);
        if(code==='silence'||code==='aborted'){ setRecStatus('idle'); return; }
        if(code==='network' && retries<MAX_RETRY){
          setRetries(r=>r+1);
          return; // SpeechManager 自己重試，這裡不需要做額外動作
        }
        setErrMsg(msg||'請再試一次。');
        setRecStatus(code==='permission'||code==='no-mic' ? 'error' : 'fail_unclear');
      },

      onEnd:()=>{
        setRetrying(0);
        setRecStatus(p=>p==='recording'?'idle':p);
      },
    });
  },[listened,recStatus,cur,retries]);

  const markDone = ()=>{
    if(!listened){ showHint('小提示：要先點「聽聽看」喔！'); return; }
    if(!isDone){
      setCompleted(p=>({...p,[grade]:[...p[grade],idx]}));
      setStarAnim(true);
      setTimeout(()=>setStarAnim(false),1600);
    }
  };

  /* 逐字比對顯示 */
  const WordComp = ()=> comparison.length ? (
    <div className="slide-up" style={{marginTop:12,padding:'12px 14px',background:'#fff',borderRadius:18,border:'2px solid #f1f5f9',textAlign:'center'}}>
      <div style={{fontSize:11,fontWeight:800,color:'#9ca3af',letterSpacing:'2px',marginBottom:8}}>逐字對照</div>
      <div style={{fontSize:17,display:'flex',flexWrap:'wrap',justifyContent:'center',gap:'4px 6px',lineHeight:1.9}}>
        {comparison.map((w,i)=>(
          <span key={i} className={w.isStop?'word-skip':w.hit?'word-hit':'word-miss'}>{w.word}</span>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:16,marginTop:10,fontSize:11,color:'#9ca3af'}}>
        <span><span className="word-hit">綠</span>=說到了</span>
        <span><span className="word-miss">紅</span>=需再練</span>
        <span><span className="word-skip">灰</span>=可跳過</span>
      </div>
    </div>
  ) : null;

  /* 錄音按鈕區 */
  const RecArea = ()=>{
    const base = { width:'100%', borderRadius:18, padding:'12px 16px', fontWeight:900, fontSize:17, fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:10, border:'4px solid', cursor:'pointer' };

    if(recStatus==='recording') return (
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <button onClick={()=>doRecord()} style={{...base,background:'#fef2f2',borderColor:'#f87171',color:'#dc2626'}}>
          <div className="items-end" style={{display:'flex',gap:3,height:24}}>
            {[0,1,2,3].map(i=>(
              <div key={i} className="wave-bar" style={{width:5,height:16,background:'#ef4444',borderRadius:3,animationDelay:`${i*.12}s`}}/>
            ))}
          </div>
          {retrying > 0 ? `再聽一次… (第 ${retrying+1} 次)` : '用心聽你說… (點我停止)'}
        </button>
      </div>
    );

    if(recStatus==='success') return (
      <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{background:'#10b981',borderRadius:18,padding:'12px 16px',color:'#fff',fontWeight:900,fontSize:17,textAlign:'center'}}>
          <div>⭐ 太棒了！全部說對！</div>
                    {audioUrl && (
            <audio controls src={audioUrl}
              style={{width:'100%',height:32,marginTop:6,borderRadius:8,opacity:0.85}}/>
          )}
          <button onClick={()=>setRecStatus('idle')} style={{marginTop:8,fontSize:12,background:'rgba(255,255,255,.2)',border:'none',color:'#fff',borderRadius:999,padding:'4px 16px',cursor:'pointer',fontFamily:'inherit'}}>再說一次</button>
        </div>
        <WordComp/>
      </div>
    );

    if(recStatus==='partial') return (
      <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{background:'#0ea5e9',borderRadius:18,padding:'12px 16px',color:'#fff',fontWeight:900,fontSize:17,textAlign:'center'}}>
          <div>🌟 說得不錯！還可以更好！</div>
                    {audioUrl && (
            <audio controls src={audioUrl}
              style={{width:'100%',height:32,marginTop:6,borderRadius:8,opacity:0.85}}/>
          )}
          <button onClick={()=>setRecStatus('idle')} style={{marginTop:8,fontSize:12,background:'rgba(255,255,255,.2)',border:'none',color:'#fff',borderRadius:999,padding:'4px 16px',cursor:'pointer',fontFamily:'inherit'}}>再說一次</button>
        </div>
        <WordComp/>
      </div>
    );

    if(recStatus==='fail_lang') return (
      <div className="slide-up" style={{...base,flexDirection:'column',gap:8,background:'#fff7ed',borderColor:'#fb923c',color:'#c2410c',padding:'14px 16px'}}>
        <div>🚫 偵測到中文！要用英文說喔！</div>
        <div style={{fontSize:13,fontWeight:700,color:'#ea580c'}}>跟著念：<em>「{cur.en.split('\n')[0]}」</em></div>
        <button onClick={()=>setRecStatus('idle')} style={{fontSize:12,background:'#fed7aa',border:'none',color:'#c2410c',borderRadius:999,padding:'4px 16px',cursor:'pointer',fontFamily:'inherit',fontWeight:800}}>再試一次</button>
      </div>
    );

    if(recStatus==='fail_unclear') return (
      <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{...base,flexDirection:'column',gap:8,background:'#fefce8',borderColor:'#facc15',color:'#854d0e',padding:'14px 16px'}}>
          <div>🎤 沒聽清楚！請靠近麥克風，大聲再說一次</div>
          <div style={{fontSize:12,fontWeight:700,color:'#a16207'}}>
            跟著念：<em>「{cur.en.split('\n')[0]}」</em>
          </div>
          {audioUrl && (
            <div style={{fontSize:11,color:'#a16207',marginTop:2}}>
              ▶ 聽聽你剛才說了什麼：
              <audio controls src={audioUrl}
                style={{width:'100%',height:28,marginTop:4,borderRadius:8}}/>
            </div>
          )}
          <button
            onClick={()=>{ setRecStatus('idle'); setTimeout(()=>doRecord(true),200); }}
            style={{fontSize:13,background:'#fde047',border:'none',color:'#713f12',borderRadius:999,padding:'6px 20px',cursor:'pointer',fontFamily:'inherit',fontWeight:900}}>
            🎤 馬上再試一次
          </button>
        </div>
        <WordComp/>
      </div>
    );

    if(recStatus==='error') return (
      <div className="slide-up" style={{...base,flexDirection:'column',gap:8,background:'#fef2f2',borderColor:'#fca5a5',color:'#dc2626',padding:'14px 16px'}}>
        <div>⚠️ {errMsg}</div>
        <button onClick={()=>setRecStatus('idle')} style={{fontSize:12,background:'#fee2e2',border:'none',color:'#dc2626',borderRadius:999,padding:'4px 16px',cursor:'pointer',fontFamily:'inherit',fontWeight:800}}>關閉</button>
      </div>
    );

    if(recStatus==='no_support') return (
      <div style={{...base,background:'#f9fafb',borderColor:'#e5e7eb',color:'#9ca3af',justifyContent:'center'}}>
        😅 這個裝置不支援錄音功能
      </div>
    );

    // idle
    return (
      <button onClick={()=>doRecord()} style={{...base,background:'#fff',borderColor:'#34d399',color:'#059669'}}>
        🎤 換你說說看
      </button>
    );
  };

  /* 語速按鈕 */
  const SpeedBtn = ({rv,emoji,label})=>(
    <button onClick={()=>setRate(rv)} style={{
      display:'flex',flexDirection:'column',alignItems:'center',gap:2,
      padding:'8px 12px',borderRadius:14,border:'none',cursor:'pointer',fontFamily:'inherit',
      background: rate===rv ? ACL : 'transparent',
      color:      rate===rv ? ACD : '#9ca3af',
      transform:  rate===rv ? 'scale(1.1)' : 'scale(1)',
      transition: 'all .15s',
    }}>
      <span style={{fontSize:28}}>{emoji}</span>
      <span style={{fontSize:11,fontWeight:800}}>{label}</span>
    </button>
  );

  /* 年級按鈕工廠 */
  const GradeBtn = ({k, colorActive, colorBg, colorBorder, colorText})=>(
    <button key={k} className="grade-btn"
      onClick={()=>{ setGrade(k); setIdx(0); }}
      style={{
        padding:'5px 13px', borderRadius:999, fontWeight:900, fontSize:13,
        border:'none', borderBottom:`4px solid ${grade===k ? colorBorder : '#e2e8f0'}`,
        background: grade===k ? colorActive : '#fff',
        color:      grade===k ? '#fff' : colorText,
        transform:  grade===k ? 'scale(1.05)' : 'scale(1)',
        transition: 'all .15s',
        cursor:'pointer', fontFamily:'inherit',
      }}>
      {ALL_DATA[k].title}
    </button>
  );

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>

      {/* 過關動畫 */}
      {starAnim && (
        <div className="star-overlay">
          <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{position:'absolute',fontSize:'9rem',animation:'ping 1s ease-out forwards',opacity:.3}}>⭐</span>
            <span className="star-pop" style={{fontSize:'7rem',position:'relative'}}>⭐</span>
          </div>
          <div className="bob" style={{marginTop:24,fontSize:36,fontWeight:900,color:ACD}}>太棒了！過關！</div>
        </div>
      )}

      {/* 提示浮動 */}
      {hint && <div className="hint-toast">🔊 {hint}</div>}

      {/* ── Header ── */}
      <header style={{
        background:'rgba(255,255,255,.87)',
        backdropFilter:'blur(14px)',
        position:'sticky',top:0,zIndex:20,
        borderBottom:`3px solid ${ACL}`,
        borderRadius:'0 0 20px 20px',
        boxShadow:'0 2px 12px rgba(0,0,0,.06)',
      }}>
        <div style={{maxWidth:500,margin:'0 auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:12}}>

          {/* 標題列 */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontWeight:900,fontSize:14,color:ACD}}>🏫 景美國小｜英語每週一句</div>
            <button onClick={()=>setSidebar(true)} style={{
              display:'flex',alignItems:'center',gap:6,
              padding:'6px 14px',borderRadius:999,fontWeight:900,fontSize:13,
              background:'#fef9c3',border:'2px solid #fcd34d',color:'#92400e',
              cursor:'pointer',fontFamily:'inherit',transition:'all .15s',
            }}>🏆 收集本</button>
          </div>

          {/* 低年級 */}
          <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:6}}>
            {LOW.map(k=><GradeBtn key={k} k={k} colorActive="#0ea5e9" colorBorder="#0284c7" colorText="#0284c7"/>)}
          </div>
          {/* 高年級 */}
          <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:6}}>
            {HIGH.map(k=><GradeBtn key={k} k={k} colorActive="#10b981" colorBorder="#059669" colorText="#059669"/>)}
          </div>

          {/* 進度條 */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:900,color:ACD,marginBottom:5}}>
              <span>尋寶進度</span>
              <span>{doneList.length} / {sentences.length} 顆星</span>
            </div>
            <div className="progress-track">
              <div className="progress-fill" style={{width:`${Math.max(4,progress)}%`}}/>
            </div>
          </div>
        </div>
      </header>

      {/* ── Main ── */}
      <main style={{flex:1,display:'flex',justifyContent:'center',padding:'16px'}}>
        <div className="card" style={{width:'100%',maxWidth:500,border:`4px solid ${ACL}`}}>

          {/* 週次標題 */}
          <div style={{background:AC,color:'#fff',textAlign:'center',padding:'12px',fontWeight:900,fontSize:20,letterSpacing:4}}>
            第 {cur.week} 週
          </div>

          <div style={{padding:'20px 18px',display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>

            {/* Icon */}
            <div className="bob" style={{fontSize:88,cursor:'pointer',filter:'drop-shadow(0 4px 8px rgba(0,0,0,.1))'}}
              onClick={()=>speak(cur.en)}>
              {cur.icon}
            </div>

            {/* 英文句子 */}
            <div className="en-sentence whitespace-pre-line" style={{fontWeight:900,color:'#1e293b',textAlign:'center',lineHeight:1.35}}>
              {cur.en}
            </div>

            {/* 中文 */}
            <div className="whitespace-pre-line" style={{fontSize:20,fontWeight:900,padding:'10px 24px',borderRadius:999,background:ACL,color:ACD,textAlign:'center',lineHeight:1.5}}>
              {cur.zh}
            </div>

            {/* 控制面板 */}
            <div style={{width:'100%',background:'#f8fafc',borderRadius:22,padding:16,border:'2px solid #f1f5f9',display:'flex',flexDirection:'column',gap:12}}>

              {/* TTS */}
              <button onClick={()=>speak(cur.en)} className="btn-3d"
                style={{width:'100%','--sh':ACB,background:'#3b82f6',boxShadow:`0 6px 0 ${ACB}`,color:'#fff',borderRadius:18,padding:'15px',border:'none',fontWeight:900,fontSize:20,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:12,cursor:'pointer'}}>
                🔊 點我聽聽看
              </button>

              {/* 語速 */}
              <div style={{display:'flex',justifyContent:'center',gap:8,background:'#fff',padding:8,borderRadius:16,border:'2px solid #f1f5f9'}}>
                <SpeedBtn rv={0.6}  emoji="🐢" label="烏龜慢慢"/>
                <SpeedBtn rv={0.85} emoji="🧒" label="正常速度"/>
                <SpeedBtn rv={1.1}  emoji="🐇" label="兔子快快"/>
              </div>

              {/* 錄音 */}
              <RecArea/>
            </div>
          </div>

          {/* 底部導覽 */}
          <div style={{padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',background:ACL,borderTop:`4px solid ${AC}44`}}>

            <button onClick={()=>setIdx(i=>Math.max(0,i-1))} disabled={idx===0}
              style={{width:48,height:48,borderRadius:'50%',background:'#fff',border:`2px solid ${idx===0?'#e2e8f0':AC}`,color:idx===0?'#d1d5db':ACD,fontSize:20,fontWeight:900,fontFamily:'inherit',cursor:idx===0?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
              ←
            </button>

            <button onClick={markDone} style={{
              display:'flex',alignItems:'center',gap:8,
              padding:'10px 20px',borderRadius:20,fontWeight:900,fontSize:17,
              border:'none',borderBottom:`4px solid ${isDone?ACD:'#d1d5db'}`,
              background:isDone?AC:'#fff',color:isDone?'#fff':'#6b7280',
              cursor:'pointer',fontFamily:'inherit',transition:'all .15s',
            }}>
              {isDone?'⭐ 恭喜過關！':'☆ 我會唸了！領星星'}
            </button>

            <button onClick={()=>setIdx(i=>Math.min(sentences.length-1,i+1))} disabled={idx===sentences.length-1}
              style={{width:48,height:48,borderRadius:'50%',background:'#fff',border:`2px solid ${idx===sentences.length-1?'#e2e8f0':AC}`,color:idx===sentences.length-1?'#d1d5db':ACD,fontSize:20,fontWeight:900,fontFamily:'inherit',cursor:idx===sentences.length-1?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
              →
            </button>
          </div>
        </div>
      </main>

      {/* ── Footer ── */}
      <footer style={{textAlign:'center',padding:'12px 0 20px',fontSize:11,fontWeight:800,color:'rgba(2,132,199,.4)'}}>
        AI協作設計：鍾子韶老師 / 王佐民老師 / 梁中梅老師 / 何進益老師
      </footer>

      {/* 覆蓋層 */}
      {sidebar && <div className="overlay" onClick={()=>setSidebar(false)}/>}

      {/* 收集本側邊欄 */}
      <div className={`sidebar ${sidebar?'open':'close'}`}>
        <div style={{padding:'20px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#fbbf24',borderRadius:'24px 0 0 0',borderBottom:'4px solid #f59e0b'}}>
          <span style={{fontWeight:900,fontSize:17,color:'#78350f'}}>🏆 我的星星收集本</span>
          <button onClick={()=>setSidebar(false)} style={{width:32,height:32,borderRadius:'50%',background:'#fcd34d',border:'2px solid #f59e0b',cursor:'pointer',fontWeight:900,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#78350f'}}>✕</button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:12,background:'#fffbeb'}}>
          {Object.entries(ALL_DATA).map(([k,d])=>{
            const cnt=completed[k].length, total=d.sentences.length, done=cnt===total, hi=HIGH.includes(k);
            const bar = done?'#fbbf24':hi?'#10b981':'#0ea5e9';
            return (
              <div key={k} onClick={()=>{setGrade(k);setIdx(0);setSidebar(false);}}
                style={{background:'#fff',borderRadius:18,padding:14,border:`4px solid ${done?'#fbbf24':'#e2e8f0'}`,cursor:'pointer',transition:'all .15s'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{fontWeight:900,color:'#1e293b'}}>{d.title}</span>
                  <span style={{fontSize:12,fontWeight:800,padding:'2px 10px',borderRadius:999,background:done?'#fef3c7':'#f1f5f9',color:done?'#92400e':'#64748b'}}>{cnt}/{total}</span>
                </div>
                <div style={{height:10,background:'#f1f5f9',borderRadius:999,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${cnt/total*100}%`,background:bar,borderRadius:999,transition:'width 1s'}}/>
                </div>
                {done && <div style={{marginTop:8,background:'#fef3c7',color:'#92400e',fontSize:12,fontWeight:900,textAlign:'center',padding:'6px',borderRadius:10}}>⭐ 恭喜全部過關！</div>}
              </div>
            );
          })}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
