  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; min-height:100%; }
    body {
      font-family: 'Nunito', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background: linear-gradient(180deg,#e0f2fe 0%,#f0fdf4 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    @keyframes bob      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes starPop  { 0%{transform:scale(.3) rotate(-15deg);opacity:0} 70%{transform:scale(1.15) rotate(5deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes ping     { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.2);opacity:0} }
    @keyframes slideUp  { from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes waveBar  { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1.3)} }
    @keyframes hintIn   { from{transform:translate(-50%,-12px);opacity:0} to{transform:translate(-50%,0);opacity:1} }
    @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.5} }
    
    @keyframes popInLeft {
      0% { transform: translateX(-20px) scale(0.8); opacity: 0; }
      70% { transform: translateX(5px) scale(1.05); opacity: 1; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes popInRight {
      0% { transform: translateX(20px) scale(0.8); opacity: 0; }
      70% { transform: translateX(-5px) scale(1.05); opacity: 1; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    .bob      { animation: bob 2s ease-in-out infinite; }
    .star-pop { animation: starPop .5s cubic-bezier(.175,.885,.32,1.275) forwards; }
    .slide-up { animation: slideUp .3s ease forwards; }
    .wave-bar { animation: waveBar .6s ease-in-out infinite; transform-origin:bottom; }
    .pulse    { animation: pulse 1.5s ease-in-out infinite; }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#bae6fd; border-radius:10px; }

    button { cursor:pointer; border:none; outline:none; font-family:inherit; }
    button:disabled { opacity:.35; cursor:default; }

    audio { width:100%; height:36px; border-radius:10px; }
    audio::-webkit-media-controls-panel { background:#f0f9ff; }

    .card {
      background:#fff;
      border-radius:28px;
      box-shadow:0 8px 32px rgba(56,189,248,.13);
      overflow:hidden;
    }
    .sidebar {
      position:fixed; inset-block:0; right:0;
      width:280px; max-width:88vw;
      background:#fff;
      border-radius:24px 0 0 24px;
      box-shadow:-6px 0 32px rgba(0,0,0,.14);
      display:flex; flex-direction:column;
      z-index:50;
      transition:transform .3s cubic-bezier(.25,.46,.45,.94);
    }
    .sidebar.open  { transform:translateX(0); }
    .sidebar.close { transform:translateX(100%); }
    .overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,.4);
      backdrop-filter:blur(3px);
      z-index:40;
    }
    .hint-toast {
      position:fixed; top:18px; left:50%; z-index:60;
      background:#ef4444; color:#fff;
      padding:10px 20px; border-radius:999px;
      font-weight:800; font-size:14px;
      box-shadow:0 4px 16px rgba(239,68,68,.4);
      animation:hintIn .25s ease;
      white-space:nowrap; pointer-events:none;
    }
    .star-overlay {
      position:fixed; inset:0; z-index:55;
      background:rgba(255,255,255,.96);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none;
    }
    .progress-track {
      background:#bae6fd; border-radius:999px; height:14px;
      overflow:hidden; border:2px solid #93c5fd;
    }
    .progress-fill {
      height:100%; border-radius:999px; background:#facc15;
      transition:width .7s ease;
    }
    .btn-3d {
      transition:box-shadow .08s, transform .08s;
    }
    .btn-3d:active {
      box-shadow:0 0px 0 var(--sh) !important;
      transform:translateY(5px);
    }

    .step-dot {
      width:10px; height:10px; border-radius:50%;
      transition:all .3s;
    }

    @media(max-width:400px){ .en-sentence{font-size:24px;} }
    @media(min-width:401px){ .en-sentence{font-size:30px;} }
  </style>
</head>

/* ═══════════════════════════════════════════════
   MediaRecorder 錄音音檔建立 (供回放使用)
═══════════════════════════════════════════════ */
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const CANDIDATES = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
  const mime = CANDIDATES.find(m => {
    try { return MediaRecorder.isTypeSupported(m); } catch(e){ return false; }
  }) || '';

  let mr;
  try {
    mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  } catch(e) {
    mr = new MediaRecorder(stream);
  }
  const actualMime = mr.mimeType || mime || 'audio/mp4';

  const chunks = [];
  mr.ondataavailable = e => { if(e.data && e.data.size > 0) chunks.push(e.data); };
  mr.start();

  return {
    stop: () => new Promise(resolve => {
      let dataReady = false;
      let stopReady = false;

      const tryResolve = () => {
        if(!dataReady || !stopReady) return;
        stream.getTracks().forEach(t => t.stop());
        if(chunks.length === 0){ resolve(null); return; }
        const blob = new Blob(chunks, { type: actualMime });
        resolve(URL.createObjectURL(blob));
      };

      mr.ondataavailable = e => {
        if(e.data && e.data.size > 0) chunks.push(e.data);
        dataReady = true;
        tryResolve();
      };
      mr.onstop = () => {
        stopReady = true;
        tryResolve();
      };
      try { mr.stop(); } catch(e) {
        stream.getTracks().forEach(t => t.stop());
        resolve(null);
      }
    }),
    abort: () => {
      try { if(mr.state !== 'inactive') mr.stop(); } catch(e) {}
      stream.getTracks().forEach(t => t.stop());
    }
  };
}

/* ═══════════════════════════════════════════════
   主元件
═══════════════════════════════════════════════ */
function App() {
  const [grade, setGrade]     = useState('1-1');
  const [idx, setIdx]         = useState(0);
  const [rate, setRate]       = useState(0.85);
  const [sidebar, setSidebar] = useState(false);
  const [starAnim, setStarAnim] = useState(false);
  const [hint, setHint]       = useState('');
  const [counts, setCounts]   = useState(loadCounts);
  
  // 錄音狀態: 'idle' | 'recording' | 'done'
  const [recState, setRecState] = useState('idle');
  const [audioUrl, setAudioUrl] = useState(null);
  
  const recorderRef = useRef(null);
  const timerRef = useRef(null);
  const recStateRef = useRef(recState);
  const countsRef = useRef(counts);

  useEffect(() => { recStateRef.current = recState; }, [recState]);
  useEffect(() => { countsRef.current = counts; }, [counts]);

  // 確保系統語音清單載入
  useEffect(() => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }
    }
  }, []);

  const sentences = ALL_DATA[grade].sentences;
  const cur       = sentences[idx];
  const countKey  = `${grade}-${idx}`;
  const practiced = counts[countKey] || 0;
  
  const doneSet   = Object.keys(counts).filter(k => k.startsWith(grade+'-') && (counts[k]||0) >= 1);
  const progress  = Math.round(doneSet.length / sentences.length * 100);

  const isHigh = HIGH.includes(grade);
  const AC  = isHigh ? '#10b981' : '#0ea5e9';
  const ACD = isHigh ? '#059669' : '#0284c7';
  const ACL = isHigh ? '#d1fae5' : '#e0f2fe';
  const ACB = isHigh ? '#059669' : '#1d4ed8';

  // 切換題目時的安全釋放
  useEffect(() => {
    if(recorderRef.current) { try{recorderRef.current.abort();}catch(e){} recorderRef.current = null; }
    clearTimeout(timerRef.current);
    
    setRecState('idle');
    if(audioUrl){ URL.revokeObjectURL(audioUrl); }
    setAudioUrl(null);
    
    if(window.speechSynthesis) window.speechSynthesis.cancel();
  }, [idx, grade]);

  // 離開頁面時的安全釋放
  useEffect(() => () => {
    if(recorderRef.current) { try{recorderRef.current.abort();}catch(e){} }
    clearTimeout(timerRef.current);
    if(window.speechSynthesis) window.speechSynthesis.cancel();
  }, []);

  const showHint = msg => { setHint(msg); setTimeout(()=>setHint(''), 3000); };

  // 智能獲取最佳英文語音
  const getBestVoice = (langPrefix) => {
    if (!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    let candidates = voices.filter(v => v.lang.startsWith(langPrefix));
    if (candidates.length === 0) return null;

    if (langPrefix === 'en') {
      const premiumNames = ['Google US English', 'Samantha', 'Alex', 'Fred', 'Victoria', 'Siri'];
      for (let name of premiumNames) {
        const match = candidates.find(v => v.name.includes(name));
        if (match) return match;
      }
    }
    return candidates[0];
  };

  // TTS 老師發音
  const speak = useCallback(text => {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g,' '));
    u.lang = 'en-US'; 
    u.rate = rate; 
    u.pitch = 1.1;
    const bestVoice = getBestVoice('en');
    if (bestVoice) u.voice = bestVoice;
    
    window.speechSynthesis.speak(u);
  }, [rate]);

  // 小劇場純英文配音
  const playScene = useCallback((dialogArray) => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    dialogArray.forEach((d) => {
      const u = new SpeechSynthesisUtterance(d.text);
      u.lang = 'en-US';
      const bestVoice = getBestVoice('en');
      if (bestVoice) u.voice = bestVoice;
      u.rate = rate;

      if (d.role.includes('👦') || d.role.includes('👨')) {
          u.pitch = 0.85;
      } else if (d.role.includes('👧') || d.role.includes('👩')) {
          u.pitch = 1.35;
      } else {
          u.pitch = 1.0;
      }

      window.speechSynthesis.speak(u);
    });
  }, [rate]);

  // 統一的錄音流程
  const handleStartRecording = async () => {
    if(!navigator.mediaDevices?.getUserMedia) {
      showHint('這個裝置不支援錄音功能');
      return;
    }
    
    try {
      if(window.speechSynthesis) window.speechSynthesis.cancel();
      if(recorderRef.current) {
          try { recorderRef.current.abort(); } catch(err){}
          recorderRef.current = null;
      }

      recorderRef.current = await startRecording();
      setRecState('recording');
      setAudioUrl(null);

      // 設定最長錄音時間防呆機制 (10秒)
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
          if (recStateRef.current === 'recording') {
              handleStopRecording();
          }
      }, 10000);

    } catch(e) {
      setRecState('idle');
      showHint('請允許麥克風權限後再試！');
    }
  };

  const handleStopRecording = async () => {
    if (recStateRef.current !== 'recording') return;
    clearTimeout(timerRef.current);

    if(recorderRef.current) {
        try {
            const url = await recorderRef.current.stop();
            setAudioUrl(url);

            // 只要成功錄音完成，就給予星星與練習次數
            const p = countsRef.current[countKey] || 0;
            const next = p + 1;
            const newCounts = { ...countsRef.current, [countKey]: next };
            setCounts(newCounts);
            saveCounts(newCounts);
            if (p === 0) {
               setStarAnim(true);
               setTimeout(() => setStarAnim(false), 1600);
            }
        } catch (e) {}
        recorderRef.current = null;
    }
    setRecState('done');
  };

  const handleRecordClick = () => {
      if (recState === 'recording') {
          handleStopRecording();
      } else {
          handleStartRecording();
      }
  };

  /* 年級按鈕 */
  const GradeBtn = ({ k, ac, acd }) => (
    <button onClick={() => { setGrade(k); setIdx(0); }}
      style={{
        padding:'5px 13px', borderRadius:999, fontWeight:900, fontSize:13,
        border:'none', borderBottom:`4px solid ${grade===k ? acd : '#e2e8f0'}`,
        background: grade===k ? ac : '#fff',
        color:      grade===k ? '#fff' : acd,
        transform:  grade===k ? 'scale(1.05)' : 'scale(1)',
        transition:'all .15s', cursor:'pointer',
      }}>
      {ALL_DATA[k].title}
    </button>
  );

  /* 練習次數顯示 */
  const PracticeStars = () => {
    const stars = Math.min(practiced, 5);
    return (
      <div style={{display:'flex',alignItems:'center',gap:6,justifyContent:'center',marginTop:4}}>
        <span style={{fontSize:12,color:'#94a3b8',fontWeight:800}}>熟練度：</span>
        {[1,2,3,4,5].map(i => (
          <span key={i} style={{fontSize:18,opacity: i<=stars ? 1 : 0.2,
            filter: i<=stars ? 'none' : 'grayscale(1)'}}>⭐</span>
        ))}
        {practiced > 5 && <span style={{fontSize:12,color:AC,fontWeight:900}}>+{practiced-5}</span>}
      </div>
    );
  };

  /* 錄音按鈕與結果區 */
  const RecArea = () => {
    if(recState === 'recording') return (
      <button onClick={handleRecordClick}
        style={{width:'100%',background:'#fef2f2',border:'4px solid #f87171',
          borderRadius:18,padding:'14px 16px',fontWeight:900,fontSize:17,
          color:'#dc2626',display:'flex',alignItems:'center',justifyContent:'center',gap:12,cursor:'pointer'}}>
        <div style={{display:'flex',gap:3,alignItems:'flex-end',height:24}}>
          {[0,1,2,3].map(i=>(
            <div key={i} className="wave-bar"
              style={{width:5,height:16,background:'#ef4444',borderRadius:3,animationDelay:`${i*.12}s`}}/>
          ))}
        </div>
        錄音中… 點我結束
      </button>
    );

    if(recState === 'done') return (
      <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{background:'#f8fafc',borderRadius:18,padding:14,border:'2px solid #f1f5f9'}}>
          <div style={{fontSize:12,fontWeight:800,color:'#94a3b8',textAlign:'center',marginBottom:10,letterSpacing:1}}>
            聽聽看老師的發音，再聽聽自己的發音，比一比！
          </div>
          <div style={{display:'grid',gridTemplateColumns: audioUrl ? '1fr 1fr' : '1fr',gap:10}}>
            
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:11,fontWeight:800,color:ACD,marginBottom:6,
                background:ACL,padding:'3px 8px',borderRadius:999,display:'inline-block'}}>
                🔊 老師
              </div>
              <button onClick={()=>speak(cur.en)}
                style={{width:'100%',background:AC,color:'#fff',border:'none',
                  borderRadius:12,padding:'10px 8px',fontWeight:900,fontSize:14,cursor:'pointer'}}>
                播放
              </button>
            </div>

            {audioUrl && (
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:11,fontWeight:800,color:'#059669',marginBottom:6,
                  background:'#d1fae5',padding:'3px 8px',borderRadius:999,display:'inline-block'}}>
                  🎤 我說的
                </div>
                <audio src={audioUrl} controls playsInline style={{width:'100%',height:36,borderRadius:12}}/>
              </div>
            )}
          </div>
        </div>
        
        <button onClick={()=>{ 
            if(recorderRef.current) { try{recorderRef.current.abort();}catch(e){} recorderRef.current = null; }
            clearTimeout(timerRef.current);
            setRecState('idle'); 
            setAudioUrl(null); 
          }}
          style={{width:'100%',background:'#fff',border:'3px solid #34d399',
            borderRadius:18,padding:'11px',fontWeight:900,fontSize:16,
            color:'#059669',cursor:'pointer'}}>
          🎤 再錄一次
        </button>
      </div>
    );

    return (
      <button onClick={handleRecordClick}
        style={{width:'100%',background:'#fff',border:'4px solid #34d399',
          borderRadius:18,padding:'14px 16px',fontWeight:900,fontSize:17,
          color:'#059669',display:'flex',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer'}}>
        🎤 換你說說看 (錄音練習)
      </button>
    );
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>

      {/* 星星動畫 */}
      {starAnim && (
        <div className="star-overlay">
          <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{position:'absolute',fontSize:'9rem',animation:'ping 1s ease-out forwards',opacity:.3}}>⭐</span>
            <span className="star-pop" style={{fontSize:'7rem',position:'relative'}}>⭐</span>
          </div>
          <div className="bob" style={{marginTop:20,fontSize:32,fontWeight:900,color:ACD}}>
            練習完成！
          </div>
        </div>
      )}

      {hint && (
        <div className="hint-toast" style={{position:'fixed',top:18,left:'50%',transform:'translateX(-50%)',zIndex:60}}>
          {hint}
        </div>
      )}

      {/* ── Header ── */}
      <header style={{
        background:'rgba(255,255,255,.87)',backdropFilter:'blur(14px)',
        position:'sticky',top:0,zIndex:20,
        borderBottom:`3px solid ${ACL}`,
        borderRadius:'0 0 20px 20px',
        boxShadow:'0 2px 12px rgba(0,0,0,.06)',
      }}>
        <div style={{maxWidth:500,margin:'0 auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontWeight:900,fontSize:14,color:ACD}}>🏫 景美國小｜英語每週一句</div>
            <button onClick={()=>setSidebar(true)} style={{
              padding:'5px 12px',borderRadius:999,fontWeight:900,fontSize:12,
              background:'#fef9c3',border:'2px solid #fcd34d',color:'#92400e',cursor:'pointer',
            }}>🏆 收集本</button>
          </div>

          <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:6}}>
            {LOW.map(k=><GradeBtn key={k} k={k} ac="#0ea5e9" acd="#0284c7"/>)}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:6}}>
            {HIGH.map(k=><GradeBtn key={k} k={k} ac="#10b981" acd="#059669"/>)}
          </div>

          <div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:900,color:ACD,marginBottom:4}}>
              <span>練習進度</span>
              <span>{doneSet.length} / {sentences.length} 題</span>
            </div>
            <div className="progress-track">
              <div className="progress-fill" style={{width:`${Math.max(4,progress)}%`}}/>
            </div>
          </div>
        </div>
      </header>

      {/* ── Main ── */}
      <main style={{flex:1,display:'flex',justifyContent:'center',padding:16}}>
        <div className="card" style={{width:'100%',maxWidth:500,border:`4px solid ${ACL}`}}>

          <div style={{background:AC,color:'#fff',textAlign:'center',padding:'11px',
            fontWeight:900,fontSize:20,letterSpacing:4}}>
            第 {cur.week} 週
          </div>

          <div style={{padding:'20px 18px',display:'flex',flexDirection:'column',alignItems:'center',gap:18}}>

            {/* Icon */}
            <div className="bob" style={{fontSize:84,cursor:'pointer',
              filter:'drop-shadow(0 4px 8px rgba(0,0,0,.1))'}}
              onClick={()=>speak(cur.en)}>
              {cur.icon}
            </div>

            {/* 英文 */}
            <div className="en-sentence" style={{fontWeight:900,color:'#1e293b',
              textAlign:'center',lineHeight:1.35,whiteSpace:'pre-line'}}>
              {cur.en}
            </div>

            {/* 中文 */}
            <div style={{fontSize:19,fontWeight:900,padding:'10px 22px',
              borderRadius:999,background:ACL,color:ACD,
              textAlign:'center',whiteSpace:'pre-line',lineHeight:1.5}}>
              {cur.zh}
            </div>

            {/* 情境小劇場 (全英) */}
            <div className="slide-up" style={{ 
                width: '100%', background: '#fdf4ff', borderRadius: 20, 
                padding: '14px 16px', border: '2px dashed #f0abfc', 
                display: 'flex', flexDirection: 'column', gap: 10 
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ fontSize: 14, fontWeight: 900, color: '#a21caf', display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span>🎬</span> <span>情境小劇場：{cur.scene}</span>
                    </div>
                    <button onClick={() => playScene(cur.dialog)} className="btn-3d"
                        style={{
                            background: '#d946ef', color: '#fff', border: 'none', borderRadius: 999,
                            padding: '6px 12px', fontSize: 12, fontWeight: 900, cursor: 'pointer',
                            '--sh': '#a21caf', boxShadow: '0 3px 0 #a21caf',
                            display: 'flex', alignItems: 'center', gap: 4
                        }}>
                        ▶️ 聽對話
                    </button>
                </div>
                
                <div key={idx} style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 4 }}>
                    {cur.dialog.map((d, i) => (
                        <div key={i} style={{ 
                            display: 'flex', gap: 8, alignItems: 'flex-start', 
                            justifyContent: i % 2 === 0 ? 'flex-start' : 'flex-end',
                            opacity: 0,
                            animation: i % 2 === 0 ? 'popInLeft 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards' : 'popInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                            animationDelay: `${i * 0.4}s`
                          }}>
                            {i % 2 === 0 && <span style={{ fontSize: 26, alignSelf:'center', filter:'drop-shadow(0 2px 2px rgba(0,0,0,0.1))' }}>{d.role}</span>}
                            <div style={{ 
                                background: '#fff', padding: '8px 12px', 
                                borderRadius: i % 2 === 0 ? '0 14px 14px 14px' : '14px 0 14px 14px', 
                                border: '2px solid #fae8ff', fontSize: 15, fontWeight: 800, 
                                color: '#4a044e', maxWidth: '85%',
                                boxShadow: '0 2px 8px rgba(250, 232, 255, 0.8)'
                              }}>
                                {d.text}
                            </div>
                            {i % 2 !== 0 && <span style={{ fontSize: 26, alignSelf:'center', filter:'drop-shadow(0 2px 2px rgba(0,0,0,0.1))' }}>{d.role}</span>}
                        </div>
                    ))}
                </div>
            </div>

            {/* 練習次數星星 */}
            <PracticeStars />

            {/* 控制面板 */}
            <div style={{width:'100%',background:'#f8fafc',borderRadius:22,
              padding:14,border:'2px solid #f1f5f9',display:'flex',flexDirection:'column',gap:10}}>

              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,
                fontSize:12,fontWeight:800,color:'#94a3b8'}}>
                <span style={{color: '#374151'}}>①</span> 先聽老師說
                <span style={{color:'#d1d5db',margin:'0 4px'}}>→</span>
                <span style={{color: '#374151'}}>②</span> 代入情境唸
                <span style={{color:'#d1d5db',margin:'0 4px'}}>→</span>
                <span style={{color: '#374151'}}>③</span> 錄音自己聽
              </div>

              {/* TTS */}
              <button onClick={()=>speak(cur.en)} className="btn-3d"
                style={{width:'100%','--sh':ACB,background:'#3b82f6',
                  boxShadow:`0 6px 0 ${ACB}`,color:'#fff',borderRadius:18,
                  padding:'14px',border:'none',fontWeight:900,fontSize:19,cursor:'pointer',
                  display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                🔊 點我聽聽看
              </button>

              {/* 語速 */}
              <div style={{display:'flex',justifyContent:'center',gap:8,
                background:'#fff',padding:8,borderRadius:16,border:'2px solid #f1f5f9'}}>
                {[
                  {rv:0.6,  emoji:'🐢', label:'慢'},
                  {rv:0.85, emoji:'🧒', label:'正常'},
                  {rv:1.1,  emoji:'🐇', label:'快'},
                ].map(({rv,emoji,label})=>(
                  <button key={rv} onClick={()=>setRate(rv)}
                    style={{display:'flex',flexDirection:'column',alignItems:'center',
                      padding:'6px 14px',borderRadius:12,border:'none',cursor:'pointer',
                      background: rate===rv ? ACL : 'transparent',
                      color:      rate===rv ? ACD : '#9ca3af',
                      transform:  rate===rv ? 'scale(1.1)':'scale(1)',
                      transition:'all .15s'}}>
                    <span style={{fontSize:24}}>{emoji}</span>
                    <span style={{fontSize:11,fontWeight:800}}>{label}</span>
                  </button>
                ))}
              </div>

              {/* 錄音區 */}
              <RecArea />
            </div>
          </div>

          {/* 底部導覽 */}
          <div style={{padding:'12px 16px',display:'flex',alignItems:'center',
            justifyContent:'space-between',background:ACL,
            borderTop:`4px solid ${AC}44`}}>

            <button onClick={()=>setIdx(i=>Math.max(0,i-1))} disabled={idx===0}
              style={{width:48,height:48,borderRadius:'50%',background:'#fff',
                border:`2px solid ${idx===0?'#e2e8f0':AC}`,
                color:idx===0?'#d1d5db':ACD,fontSize:20,fontWeight:900,
                cursor:idx===0?'default':'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
              ←
            </button>

            <div style={{textAlign:'center'}}>
              <div style={{fontSize:14,fontWeight:900,color:ACD}}>
                {idx+1} / {sentences.length}
              </div>
            </div>

            <button onClick={()=>setIdx(i=>Math.min(sentences.length-1,i+1))}
              disabled={idx===sentences.length-1}
              style={{width:48,height:48,borderRadius:'50%',background:'#fff',
                border:`2px solid ${idx===sentences.length-1?'#e2e8f0':AC}`,
                color:idx===sentences.length-1?'#d1d5db':ACD,fontSize:20,fontWeight:900,
                cursor:idx===sentences.length-1?'default':'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
              →
            </button>
          </div>
        </div>
      </main>

      {/* Footer */}
      <footer style={{textAlign:'center',padding:'10px 0 18px',
        fontSize:11,fontWeight:800,color:'rgba(2,132,199,.4)'}}>
        AI協作設計：鍾子韶老師 / 王佐民老師 / 梁中梅老師 / 何進益老師<br/>情境聲動全英版
      </footer>

      {/* 側邊欄遮罩 */}
      {sidebar && <div className="overlay" onClick={()=>setSidebar(false)}/>}

      {/* 收集本側邊欄 */}
      <div className={`sidebar ${sidebar?'open':'close'}`}>
        <div style={{padding:'18px 20px',display:'flex',alignItems:'center',
          justifyContent:'space-between',background:'#fbbf24',
          borderRadius:'24px 0 0 0',borderBottom:'4px solid #f59e0b'}}>
          <span style={{fontWeight:900,fontSize:17,color:'#78350f'}}>🏆 練習收集本</span>
          <button onClick={()=>setSidebar(false)}
            style={{width:32,height:32,borderRadius:'50%',background:'#fcd34d',
              border:'2px solid #f59e0b',cursor:'pointer',fontWeight:900,
              fontSize:16,color:'#78350f'}}>✕</button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:14,
          display:'flex',flexDirection:'column',gap:10,background:'#fffbeb'}}>
          {Object.entries(ALL_DATA).map(([k,d])=>{
            const gradeCounts = Object.keys(counts).filter(ck=>ck.startsWith(k+'-'));
            const practiced1  = gradeCounts.filter(ck=>(counts[ck]||0)>=1).length;
            const practiced3  = gradeCounts.filter(ck=>(counts[ck]||0)>=3).length;
            const total = d.sentences.length;
            const hi = HIGH.includes(k);
            const bar = practiced3===total?'#fbbf24':hi?'#10b981':'#0ea5e9';
            return (
              <div key={k} onClick={()=>{setGrade(k);setIdx(0);setSidebar(false);}}
                style={{background:'#fff',borderRadius:18,padding:14,
                  border:`4px solid ${practiced3===total?'#fbbf24':'#e2e8f0'}`,cursor:'pointer'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{fontWeight:900,color:'#1e293b'}}>{d.title}</span>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2}}>
                    <span style={{fontSize:11,fontWeight:800,color:'#64748b'}}>
                      練過：{practiced1}/{total}
                    </span>
                    <span style={{fontSize:11,fontWeight:800,color:ACD}}>
                      熟練：{practiced3}/{total}
                    </span>
                  </div>
                </div>
                <div style={{height:8,background:'#f1f5f9',borderRadius:999,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${practiced3/total*100}%`,
                    background:bar,borderRadius:999,transition:'width 1s'}}/>
                </div>
                {practiced3===total && (
                  <div style={{marginTop:8,background:'#fef3c7',color:'#92400e',
                    fontSize:12,fontWeight:900,textAlign:'center',padding:6,borderRadius:10}}>
                    ⭐ 全部熟練！
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
